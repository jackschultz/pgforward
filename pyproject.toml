[project]
name = "pgforward"
version = "0.0.0"
description = "Postgres migrations in plain SQL files, forward only, built for coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
pgforward = "pgforward.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
